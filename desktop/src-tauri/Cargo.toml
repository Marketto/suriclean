[package]
name = "suriclean"
version = "1.0.0"
description = "SuriClean – la suricata spazzina"
authors = ["Marco Ricupero"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
trash = "5"
sha2 = "0.10"
dirs = "5"
sysinfo = { version = "0.32", default-features = false, features = ["disk"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
