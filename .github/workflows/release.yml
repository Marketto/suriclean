name: Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Version
        shell: bash
        run: echo "SURI_VERSION=1.$((GITHUB_RUN_NUMBER + 10))" >> "$GITHUB_ENV"

      - name: Build app and DMG
        run: |
          swift --version
          chmod +x build.sh scripts/make-dmg.sh
          scripts/make-dmg.sh

      - name: Smoke test (launch and screenshot)
        continue-on-error: true
        run: |
          open dist/SuriClean.app
          sleep 15
          if pgrep -x SuriClean >/dev/null; then echo "✅ SuriClean is running"; else echo "❌ SuriClean is not running"; exit 1; fi
          screencapture -x dist/screenshot-mac.png || true
          pkill -x SuriClean || true

      - name: APFS layout (for the disk breakdown)
        continue-on-error: true
        run: |
          diskutil info -plist /System/Volumes/Data | plutil -extract APFSContainerReference raw -
          diskutil apfs list -plist | plutil -p - | grep -E '"(ContainerReference|Name|Roles|CapacityInUse)"|=> "(System|Data|VM|Preboot|Recovery)"' | head -40

      - name: Mount test
        run: |
          hdiutil attach dist/SuriClean.dmg -nobrowse -mountpoint /tmp/suri
          ls -la /tmp/suri
          /usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" /tmp/suri/SuriClean.app/Contents/Info.plist
          hdiutil detach /tmp/suri

      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: |
            dist/SuriClean.dmg
            dist/screenshot-mac.png
          if-no-files-found: warn

  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Version
        shell: bash
        run: echo "SURI_VERSION=1.$((GITHUB_RUN_NUMBER + 10))" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev libfuse2 xvfb imagemagick dbus-x11

      - name: Prepare sources and version
        shell: bash
        run: |
          cp shared/suri.js shared/chiptune.js desktop/ui/
          V="${SURI_VERSION}.0"
          node -e "const f='desktop/src-tauri/tauri.conf.json';const j=require('./'+f);j.version='$V';require('fs').writeFileSync(f,JSON.stringify(j,null,2))"
          sed -i.bak "0,/^version = .*/s//version = \"$V\"/" desktop/src-tauri/Cargo.toml && rm desktop/src-tauri/Cargo.toml.bak
          cd desktop && npx --yes @tauri-apps/cli@2 icon ../Resources/AppIcon.png

      - name: Build
        shell: bash
        working-directory: desktop
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then B=nsis; else B=deb,appimage; fi
          npx --yes @tauri-apps/cli@2 build --bundles $B

      - name: Collect installers
        shell: bash
        run: |
          mkdir -p dist
          B=desktop/src-tauri/target/release/bundle
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp $B/nsis/*-setup.exe dist/SuriClean-Windows-Setup.exe
          else
            cp $B/deb/*.deb dist/SuriClean-Linux.deb
            cp $B/appimage/*.AppImage dist/SuriClean-Linux.AppImage
          fi
          ls -la dist

      - name: Smoke test (Linux, screenshot)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          xvfb-run -a -s "-screen 0 1280x820x24" bash -c '
            dbus-launch desktop/src-tauri/target/release/suriclean & sleep 18
            import -window root dist/screenshot-linux.png
            pgrep -f target/release/suriclean && echo "✅ running" || echo "❌ not running"
          '

      - name: Smoke test (Windows, screenshot)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "desktop/src-tauri/target/release/suriclean.exe" -PassThru
          Start-Sleep -Seconds 18
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("dist/screenshot-windows.png")
          if ($p.HasExited) { Write-Host "❌ exited" } else { Write-Host "✅ running"; Stop-Process -Id $p.Id }

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          path: dist/*
          if-no-files-found: warn

  release:
    needs: [mac, desktop]
    if: always() && needs.mac.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version
        shell: bash
        run: echo "SURI_VERSION=1.$((GITHUB_RUN_NUMBER + 10))" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          path: art
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la art
          NOTES=$(git log -1 --pretty=%B | grep -v -E '^(Co-Authored-By|Claude-Session):' )
          printf '%s\n\n---\n**Installazione:** Mac → apri il DMG e trascina Suri in Applicazioni (prima volta: tasto destro › Apri). Windows → esegui il Setup («Ulteriori informazioni» › «Esegui comunque»). Ubuntu → apri il .deb oppure usa l'\''AppImage.\n\nSito: https://marketto.github.io/suriclean/\n' "$NOTES" > notes.md
          FILES=$(ls art/SuriClean.dmg art/SuriClean-Windows-Setup.exe art/SuriClean-Linux.deb art/SuriClean-Linux.AppImage 2>/dev/null)
          if gh release view "v${SURI_VERSION}" >/dev/null 2>&1; then
            gh release upload "v${SURI_VERSION}" $FILES --clobber
          else
            gh release create "v${SURI_VERSION}" $FILES --title "SuriClean ${SURI_VERSION} 🐾" --notes-file notes.md --latest
          fi

      - name: Build site
        run: |
          mkdir -p _site
          cp site/index.html shared/suri.js shared/chiptune.js _site/
          cp Resources/AppIcon.png _site/icon.png
          if [ -f art/screenshot-mac.png ]; then cp art/screenshot-mac.png _site/screenshot.png; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: art/screenshot-*.png
          if-no-files-found: ignore

  pages:
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
